# roster.yaml — agentive-workflow component roster (introduced in 2.0.0, KIT-0096)
#
# The deliberate ships/kit-side decision record for every component in the
# upstream kit's canonical `.claude/` tree, plus retired plugin components.
# It is ALSO the comparison input for TWO CI guards — one per repo, each
# owning one hash column (KIT-0110):
#
#   kit_sha256   is verified in the KIT repo (movito/agentive-starter-kit,
#                scripts/local/check_plugin_drift.py): FAILS when the kit's
#                canonical file no longer matches the hash recorded at
#                release time — the kit is newer than the published release.
#   plugin_sha256 is verified in THIS repo
#                (.github/workflows/verify-plugin.yml →
#                scripts/verify_plugin_integrity.py): FAILS when a published
#                body no longer matches the roster — a release that bumped
#                hashes but forgot to copy the merged bodies, or an edit
#                outside a release.
#
# The plugin bodies intentionally differ from kit canon (generalization
# per KIT-ADR-0025). That difference is BY DESIGN and is exactly why each
# side needs its own hash column — "differs from canon" does not mean
# "unverifiable". Both columns are maintained by the kit's
# scripts/local/plugin_resync.py (work-list from roster hashes, three-way
# merge, conflict surfacing).
#
# Fields per entry:
#   name:        component name (file basename without .md)
#   kind:        agent | command | skill
#   ships:       true = distributed in this plugin; false = stays kit-side
#   source:      canonical file path in the upstream kit repo
#                (movito/agentive-starter-kit); absent for retired entries
#   why:         one-line rationale for the ships/kit-side/retired decision
#   kit_version: the kit source's `version:` frontmatter at release time
#                (shipped entries only)
#   kit_sha256:  sha256 of the kit source file at release time (shipped
#                entries only) — the KIT-side drift guard's anchor; pins
#                the KIT file the copy was derived from.
#   plugin_sha256: sha256 of the published body in THIS repo (shipped
#                entries only) — the marketplace-side CI check's anchor.
#   retired:     true for components removed from the plugin in this release
#
# Machine consumers: parse with any YAML loader. Update this file in the
# same commit as any component refresh — both guards treat a stale roster
# exactly like stale content (FAIL).

